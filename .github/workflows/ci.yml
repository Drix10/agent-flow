name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm ci
      - run: npm run lint
      - name: Run npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Show test output on failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### npm test output'
            echo '```'
            tail -c 60000 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # GITHUB_STEP_SUMMARY isn't reachable via the plain REST API (only
          # the web UI / blob storage). Also emit the tail as ::error::
          # workflow commands, which Actions turns into check-run
          # annotations — those ARE readable via GET .../check-runs/{id}/annotations.
          tail -c 3000 test-output.log | fold -w 900 | while IFS= read -r line; do
            echo "::error::${line}"
          done
      - run: npm pack --dry-run

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: npm ci
      - run: npm run lint
      - name: Run npm test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Show test output on failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### npm test output'
            echo '```'
            tail -c 60000 test-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # GITHUB_STEP_SUMMARY isn't reachable via the plain REST API (only
          # the web UI / blob storage). Also emit ::error:: workflow commands,
          # which Actions turns into check-run annotations — those ARE
          # readable via GET .../check-runs/{id}/annotations. GitHub caps
          # annotations at 10 per step, so start at the first TAP failure
          # (not just the tail of the log) and pack many lines per message.
          FIRST_FAIL=$(grep -n '^not ok' test-output.log | head -1 | cut -d: -f1)
          if [ -n "$FIRST_FAIL" ]; then
            tail -n "+$FIRST_FAIL" test-output.log | head -c 6000
          else
            tail -c 6000 test-output.log
          fi | awk 'BEGIN{buf=""} {buf = buf $0 "%0A"; if (length(buf) > 800) {print "::error::" buf; buf=""}} END{if (length(buf)>0) print "::error::" buf}'
      - run: npm pack --dry-run
